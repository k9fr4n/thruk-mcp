# Docker MCP catalog entry for thruk-mcp.
#
# Usage with a custom local catalog:
#   docker mcp catalog create thruk-private
#   docker mcp catalog add  thruk-private thruk-mcp ./catalog/server.yaml
#   docker mcp server  enable thruk-mcp
#   docker mcp gateway run    --catalog thruk-private
#
# Or submit upstream to https://github.com/docker/mcp-registry
name: thruk-mcp
image: ghcr.io/k9fr4n/thruk-mcp:latest
type: server
meta:
  category: monitoring
  tags:
    - monitoring
    - thruk
    - naemon
    - nagios
    - icinga
    - shinken
about:
  title: Thruk Monitoring
  description: >-
    Query Thruk (Naemon / Nagios / Icinga / Shinken monitoring frontend) via
    its REST API: list and inspect hosts and services, current problems and
    stats, schedule or remove downtimes, acknowledge issues, and trigger
    forced rechecks. Includes a raw `thruk_query` escape hatch for any other
    Thruk REST endpoint.
  icon: https://www.thruk.org/images/thruk_logo.png
source:
  project: https://github.com/k9fr4n/thruk-mcp
config:
  description: Configure access to your Thruk REST API.
  secrets:
    - name: thruk-mcp.api_key
      env: THRUK_API_KEY
      example: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  env:
    - name: THRUK_BASE_URL
      example: https://monitor.example.com/thruk
      value: '{{thruk-mcp.base_url}}'
    - name: THRUK_AUTH_USER
      example: thrukadmin
      value: '{{thruk-mcp.auth_user}}'
    - name: THRUK_VERIFY_SSL
      example: "true"
      value: '{{thruk-mcp.verify_ssl}}'
    - name: THRUK_DEFAULT_BACKENDS
      example: "prod,dr"
      value: '{{thruk-mcp.default_backends}}'
    - name: THRUK_READ_ONLY
      example: "false"
      value: '{{thruk-mcp.read_only}}'
    - name: THRUK_ENABLED_TOOLS
      example: "thruk_list_*,thruk_problems,thruk_stats"
      value: '{{thruk-mcp.enabled_tools}}'
    - name: THRUK_AUDIT_LOG
      example: "true"
      value: '{{thruk-mcp.audit_log}}'
    - name: THRUK_MAX_CONCURRENT
      example: "8"
      value: '{{thruk-mcp.max_concurrent}}'
    - name: THRUK_MCP_WORKDIR
      example: "/tmp/thruk-report"
      value: '{{thruk-mcp.workdir}}'
    - name: THRUK_SPILL_THRESHOLD_KB
      example: "200"
      value: '{{thruk-mcp.spill_threshold_kb}}'
  parameters:
    type: object
    properties:
      base_url:
        type: string
        description: Thruk base URL (no trailing slash).
      auth_user:
        type: string
        description: Optional user to impersonate (only with superuser API key).
      verify_ssl:
        type: string
        description: "Set 'false' to skip TLS verification (dev / self-signed only)."
        default: "true"
      default_backends:
        type: string
        description: Comma-separated default Thruk backend names (federated sites). Empty = all.
      read_only:
        type: string
        description: "Set 'true' to disable every write tool (ack, downtime, recheck, ...)."
        default: "false"
      enabled_tools:
        type: string
        description: Comma-separated allowlist of tool names (fnmatch wildcards accepted). Empty = all.
      audit_log:
        type: string
        description: Emit one JSON audit line per write tool invocation on stderr.
        default: "true"
      max_concurrent:
        type: string
        description: Cap of concurrent in-flight HTTP requests to Thruk. 0 = unlimited.
        default: "0"
      workdir:
        type: string
        description: >-
          Directory where large tool responses are written instead of being returned
          inline (e.g. /tmp/thruk-report). When unset, all responses are inline.
          Recommended for pipelines processing hundreds of hosts over 24-72 h windows.
      spill_threshold_kb:
        type: string
        description: >-
          Payload size threshold in KB above which the response is spilled to disk
          instead of returned inline. Default: 200 (safely below Dust's ~256 KB cap).
        default: "200"
    required:
      - base_url
# allowHosts restricts outbound network access when running under the Docker MCP Gateway.
# List every host:port your Thruk instance is reachable on, e.g.:
#   allowHosts:
#     - monitor.example.com:443
# Leave the key absent (as below) to allow any outbound host — required if
# THRUK_BASE_URL varies per user or is set at runtime.
#
# allowHosts: []   ← DO NOT use an empty list; it blocks ALL network traffic.
