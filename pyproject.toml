[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thruk-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server exposing the Thruk monitoring REST API (Naemon / Nagios / Icinga / Shinken)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Franck SALLET" }]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "mcp[cli]>=1.2.0",
  "httpx>=0.27",
  "pydantic>=2.5",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
thruk-mcp = "thruk_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/k9fr4n/thruk-mcp"
Issues = "https://github.com/k9fr4n/thruk-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/thruk_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
