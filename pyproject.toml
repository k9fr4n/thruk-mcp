[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thruk-mcp"
version = "1.0.5"
description = "Model Context Protocol (MCP) server exposing the Thruk monitoring REST API (Naemon / Nagios / Icinga / Shinken)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Franck SALLET" }]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "mcp[cli]>=1.2.0",
  "httpx>=0.27",
  "pydantic>=2.5",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4",
]

[project.scripts]
thruk-mcp = "thruk_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/k9fr4n/thruk-mcp"
Issues = "https://github.com/k9fr4n/thruk-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/thruk_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skip the live-Thruk integration suite by default. The integration workflow
# overrides this with `-m integration`.
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = [
  "integration: live integration tests requiring a running Thruk (run with '-m integration')",
]

[tool.coverage.run]
source = ["src/thruk_mcp"]
branch = true

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true

[tool.mypy]
python_version = "3.10"
files = ["src/thruk_mcp"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false  # relaxed for now; flip to true in v0.5

[[tool.mypy.overrides]]
module = "thruk_mcp.server"
disable_error_code = ["misc"]  # FastMCP decorators confuse type-checker
