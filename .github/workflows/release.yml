name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases
  packages: write
  id-token: write   # needed for PyPI OIDC trusted publishing

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/thruk-mcp
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate Docker MCP Gateway metadata label
        run: |
          pip install -e . -q
          SERVER_METADATA=$(python scripts/gen_metadata.py)
          echo "SERVER_METADATA=${SERVER_METADATA}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_METADATA=${{ env.SERVER_METADATA }}
          provenance: true
          sbom: true

      # Create a GitHub Release only when a vX.Y.Z tag is pushed.
      # --generate-notes auto-builds the changelog from commits since the previous tag.
      # The `gh release create` call is idempotent: it exits 0 if the release already exists.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest \
          || echo "Release already exists, skipping."

  # Publish to PyPI on every vX.Y.Z tag.
  # Runs in the same workflow so GITHUB_TOKEN limitations on cross-workflow
  # event triggering are irrelevant (pypi.yml uses release:published which
  # is never fired when the release is created by GITHUB_TOKEN).
  publish-pypi:
    name: Publish to PyPI
    needs: image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/thruk-mcp
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
