name: Publish to PyPI (manual fallback)

# Automatic PyPI publishing on vX.Y.Z tags is handled by release.yml
# (publish-pypi job). This workflow exists only as a manual fallback via
# workflow_dispatch in case that job needs to be re-run independently.
# The `release: [published]` trigger is intentionally removed: GitHub
# blocks cross-workflow events fired by GITHUB_TOKEN, so it would never
# trigger automatically anyway.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publisher)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/thruk-mcp
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          # OIDC trusted publishing - no token needed once the pending
          # publisher is configured on pypi.org (Account Settings -> Publishing).
          # Required values for that pending publisher:
          #   PyPI project name: thruk-mcp
          #   Repository owner:  k9fr4n
          #   Repository name:   thruk-mcp
          #   Workflow name:     pypi.yml
          #   Environment:       pypi
          attestations: true
