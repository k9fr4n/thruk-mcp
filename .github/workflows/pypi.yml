name: Publish to PyPI (manual fallback)

# Automatic PyPI publishing on vX.Y.Z tags is handled by release.yml
# (publish-pypi job). This workflow exists only as a manual fallback via
# workflow_dispatch in case that job needs to be re-run independently.
# The `release: [published]` trigger is intentionally removed: GitHub
# blocks cross-workflow events fired by GITHUB_TOKEN, so it would never
# trigger automatically anyway.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publisher)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/thruk-mcp
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          # OIDC trusted publishing - no token needed once the pending
          # publisher is configured on pypi.org (Account Settings -> Publishing).
          # Required values for that pending publisher:
          #   PyPI project name: thruk-mcp
          #   Repository owner:  k9fr4n
          #   Repository name:   thruk-mcp
          #   Workflow name:     pypi.yml
          #   Environment:       pypi
          attestations: true
